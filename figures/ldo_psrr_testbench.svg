<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f5f8fa"/>
<text x="36" y="57" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="bold" fill="#193a50">PSRR: identify the injected domain and the quiet sources</text>
<rect x="40" y="185" width="285" height="125" rx="12" fill="#e7f0f5" stroke="#52788f" stroke-width="2"/>
<text x="56" y="220" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#193a50">Supply under test</text>
<text x="56" y="250" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#193a50">DC = VIN nominal</text>
<text x="56" y="280" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#193a50">AC magnitude = 1</text>
<rect x="460" y="185" width="250" height="160" rx="12" fill="#e7f0f5" stroke="#52788f" stroke-width="2"/>
<text x="476" y="220" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#193a50">LDO DUT</text>
<text x="476" y="250" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#193a50">Correct DC point</text>
<text x="476" y="278" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#193a50">Measure VOUT / return</text>
<polyline points="325,248 460,248" fill="none" stroke="#234b65" stroke-width="3"/>
<polygon points="460,248 447.0,242.0 447.0,254.0" fill="#234b65"/>
<polyline points="710,248 1080,248" fill="none" stroke="#234b65" stroke-width="3"/>
<polygon points="1080,248 1067.0,242.0 1067.0,254.0" fill="#234b65"/>
<text x="800" y="235" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#193a50">VOUT_ac</text>
<rect x="40" y="390" width="285" height="135" rx="12" fill="#e7f0f5" stroke="#52788f" stroke-width="2"/>
<text x="56" y="425" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#193a50">Quiet sources</text>
<text x="56" y="455" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#193a50">VREF / bias: AC = 0</text>
<text x="56" y="485" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#193a50">EN: valid HIGH</text>
<polyline points="325,450 390,450 390,310 460,310" fill="none" stroke="#234b65" stroke-width="3"/>
<polygon points="460,310 447.0,304.0 447.0,316.0" fill="#234b65"/>
<rect x="800" y="365" width="340" height="115" rx="12" fill="#e7f0f5" stroke="#52788f" stroke-width="2"/>
<text x="816" y="400" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#193a50">Keep output network</text>
<text x="816" y="430" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#193a50">IOUT, COUT, ESR, ESL</text>
<text x="816" y="460" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#193a50">Separate application variant</text>
<polyline points="890,248 890,365" fill="none" stroke="#234b65" stroke-width="3"/>
<polygon points="890,365 896.0,352.0 884.0,352.0" fill="#234b65"/>
<text x="40" y="587" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#193a50">PSRR = -20 log10 |VOUT_ac / VIN_ac|</text>
<text x="40" y="626" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" fill="#193a50">AC=1 is small-signal normalization; it is not a physical 1 V ripple.</text>
</svg>